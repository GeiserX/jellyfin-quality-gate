name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version and check tag
        id: check
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.QualityGate/Jellyfin.Plugin.QualityGate.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "::notice::Tag v${VERSION} already exists — skipping release"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Get version from csproj
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.QualityGate/Jellyfin.Plugin.QualityGate.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create plugin package
        run: |
          mkdir -p release
          cp Jellyfin.Plugin.QualityGate/bin/Release/net10.0/Jellyfin.Plugin.QualityGate.dll release/
          cp Jellyfin.Plugin.QualityGate/bin/Release/net10.0/build.yaml release/ 2>/dev/null || true
          cd release && zip -r ../quality-gate_${{ steps.version.outputs.version }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Quality Gate v${{ steps.version.outputs.version }}
          files: quality-gate_${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The published manifest is derived from the release list, not from the copy in the repo.
      # It used to be the committed copy plus one entry, which made a bookkeeping commit
      # load-bearing: when it did not land, the next release rebuilt from a stale base and the
      # missing version vanished from the catalogue. That is how 3.3.6.0 and 3.4.0.0 went, and
      # the recording step had been failing silently since, because Actions may not open pull
      # requests here. Deriving it makes losing a version impossible.
      - name: Build the published manifest from the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/build-manifest.py \
            "$GITHUB_REPOSITORY" manifest.json manifest.json
          # The release was cut moments ago, so prove it is actually in what we are about to
          # publish rather than trusting the API to have caught up.
          python3 - "$VERSION" <<'CHECK'
          import json, sys
          want = sys.argv[1]
          have = [v["version"] for v in json.load(open("manifest.json"))[0]["versions"]]
          if want not in have:
              sys.exit("refusing to publish: %s is missing from the generated manifest %s"
                       % (want, have[:5]))
          print("manifest contains %s and %d versions in total" % (want, len(have)))
          CHECK

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Publishing the manifest must not depend on cutting a release. The Pages deploy lives in the
  # build job, which is gated on should_release, so a manifest-only fix could never reach
  # geiserx.github.io: on 2026-08-28 the corrected plugin GUID merged, the workflow finished in
  # 7 seconds because v3.5.0.0 was already tagged, and the placeholder GUID stayed live. This job
  # covers exactly the case the other one skips, so the two are mutually exclusive.
  publish-manifest:
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the published manifest from the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/build-manifest.py \
            "$GITHUB_REPOSITORY" manifest.json manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
