name: "QualityGate"
guid: "9cab70ca-0af3-4d3a-adab-6a0df2496a33"
version: "3.5.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "GeiserX"
overview: "Cap the resolution a user may be served, measured against the media's actual height."
description: "Quality Gate lets Jellyfin administrators cap the resolution a user may be served. The cap is measured against the media's actual height, read from its video stream, so it holds whatever the file is called. Media above the cap is served as a capped transcode, or as a lower-resolution version of the same item where one exists, and requests for the original file are refused. Useful for bandwidth management and tiered access."
category: "General"
imageUrl: ""
artifacts:
  - Jellyfin.Plugin.QualityGate.dll
changelog: |
  ## v3.5.0.0
  - Resolution cap enforced on the media's actual height (video MediaStream), not on filenames
  - New per-policy "Maximum Resolution" setting; 0 (No limit) is the default, so existing configs are unchanged
  - Negotiation: PlaybackInfo now offers a lower-resolution version of the item when one exists, and otherwise a transcode capped at the policy height
  - Direct delivery: /Videos/{id}/stream, stream.{container}, master/main/live.m3u8, hls1 segments, /Audio/{id}/stream and /Items/{id}/File and /Download return 403 for an over-cap item
  - Closes the legacy `params` bypass, whose positional fields overrode the static flag and max height inside the action
  - Media with no probed height is allowed and logged as a warning; negotiation still transcodes it at the cap
  ## v3.4.0.0
  - Intro-only build for Jellyfin 12: targets ABI 12.0.0.0 on net10.0 (12.0.0-rc5 packages)
  - The QualityGate API controller was deleted; MediaSourceResultFilter is no longer registered or active, so filename patterns restrict nothing (the type stays in the assembly, inert)
  - Per-policy intro videos and the admin page remain
  ## v3.2.0.0
  - BREAKING: removed path-prefix support entirely (filename regex patterns only)
  - Fail-closed default policy: broken/disabled DefaultPolicyId now denies instead of granting full access
  - Dangling symlink protection: File.Exists() check applied consistently across all code paths
  - Added unit test suite (IsPathAllowed + IsSourcePlayable)
  - Updated DenyAllPolicy sentinel to use filename pattern matching
  ## v3.1.0.0
  - Skip intro on resume: intros no longer play when resuming a movie mid-playback
  - Skip intro on rewatch: for TV shows, intro plays only on the first episode of a series
  - Trimmed config UI: removed path prefix fields, keeping only filename pattern rules
  ## v3.0.0.0
  - Filename regex pattern matching for Jellyfin multi-version naming
  - Case-insensitive regex with 1-second timeout to prevent ReDoS
  ## v2.0.6.0
  - Integrated table footer: single full-width tfoot row replacing three-cell layout
  - Stronger zebra striping for visible row differentiation
  - Footer layout: rows-per-page left, range center, nav buttons right
  ## v2.0.5.0
  - Sortable columns, pagination, and stronger zebra striping for the User Access table
  - Inline policy assignment updates (no collectFromDOM rebuild)
  - Path actions moved below path list for clearer layout
  ## v2.0.4.0
  - Reworked the configuration page into a clearer native Jellyfin admin layout
  - Restored the user access table, stronger policy grouping, and destructive delete styling
  ## v2.0.3.0
  - Fail-closed on invalid policy overrides: user assigned to deleted/disabled/mistyped policy is denied (was falling through to full access)
  - Separator-aware path matching: `/media` no longer matches `/media2`
  - Filter QueryResult<BaseItemDto> list endpoints in addition to single items and PlaybackInfo
  ## v2.0.2.0
  - Fail-closed: return empty sources when all are blocked (was keeping originals)
  - Remove dead code: OnPlaybackStart handler, FindAllowedVersion, QualityGateEntryPoint
  - Align README and plugin description with actual behavior
  ## v2.0.1.0
  - Fix IDOR: custom API controller now binds to authenticated caller instead of accepting caller-supplied userId
  - Deny media sources with null/empty paths (fail-closed)
  ## v2.0.0.0
  - Replaced broken middleware with IAsyncResultFilter (fixes response compression conflict)
  - MediaSource filtering now works correctly with all Jellyfin clients
  - Consolidated plugin service registration
  - Renamed repo from jellyfin-quality-gate to quality-gate
  ## v1.0.11.0
  - Disabled middleware filtering - does not work due to Jellyfin response compression
  ## v1.0.9.0
  - Fixed configuration UI - buttons and dropdowns now work properly
  - Added comprehensive documentation with policy examples
  ## v1.0.0.0
  - Initial release
